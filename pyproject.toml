[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "representation-redistricting"
version = "0.1.0"
description = "Compactness- and population-driven redistricting by local search on unit graphs"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "scipy", "networkx"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["redistricting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
